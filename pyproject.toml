[project]
name = "google-tts-demo"
version = "0.1.0"
description = "Playground para probar Google Cloud Text-to-Speech con Gemini TTS"
readme = "README.md"
authors = [
    { name = "Rafael Guevara Aller", email = "djzm80@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-cloud-texttospeech>=2.37.0",
    "gradio>=6.28.0",
    "mutagen>=1.48.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
google-tts-demo = "google_tts_demo.main:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "SIM",
    "UP",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
